name: taskflow

x-server-environment: &server-environment
  NODE_ENV: production
  DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to the Neon PostgreSQL connection string}
  REDIS_URL: ${REDIS_URL:?Set REDIS_URL to the Upstash Redis connection string}
  JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET to a strong, unique secret}
  CLIENT_URL: ${CLIENT_URL:-http://localhost}
  JOB_ATTEMPTS: ${JOB_ATTEMPTS:-3}
  JOB_BACKOFF_DELAY_MS: ${JOB_BACKOFF_DELAY_MS:-1000}
  JOB_STALE_TIMEOUT_MS: ${JOB_STALE_TIMEOUT_MS:-600000}
  WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-5}
  WORKER_LOCK_DURATION_MS: ${WORKER_LOCK_DURATION_MS:-30000}
  WORKER_STALLED_INTERVAL_MS: ${WORKER_STALLED_INTERVAL_MS:-30000}
  WORKER_MAX_STALLED_COUNT: ${WORKER_MAX_STALLED_COUNT:-1}
  DISPATCHER_POLL_INTERVAL_MS: ${DISPATCHER_POLL_INTERVAL_MS:-1000}
  DISPATCHER_BATCH_SIZE: ${DISPATCHER_BATCH_SIZE:-20}
  OUTBOX_CLAIM_TIMEOUT_MS: ${OUTBOX_CLAIM_TIMEOUT_MS:-60000}
  OUTBOX_RETRY_BASE_MS: ${OUTBOX_RETRY_BASE_MS:-1000}
  OUTBOX_RETRY_MAX_MS: ${OUTBOX_RETRY_MAX_MS:-300000}
  JOB_SUBMISSION_RATE_LIMIT: ${JOB_SUBMISSION_RATE_LIMIT:-60}
  JOB_SUBMISSION_RATE_WINDOW_MS: ${JOB_SUBMISSION_RATE_WINDOW_MS:-60000}
  QUEUE_MAX_WAITING_JOBS: ${QUEUE_MAX_WAITING_JOBS:-10000}
  QUEUE_MAX_PENDING_JOBS: ${QUEUE_MAX_PENDING_JOBS:-20000}
  QUEUE_BACKPRESSURE_RETRY_AFTER_SECONDS: ${QUEUE_BACKPRESSURE_RETRY_AFTER_SECONDS:-5}
  SHUTDOWN_GRACE_PERIOD_MS: ${SHUTDOWN_GRACE_PERIOD_MS:-30000}

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    environment:
      PORT: "8080"
      API_UPSTREAM: http://api:5000
    ports:
      - "${FRONTEND_PORT:-80}:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    command: ["node", "dist/index.js"]
    environment:
      <<: *server-environment
      PORT: "5000"
    expose:
      - "5000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped
    stop_grace_period: 35s

  worker:
    build:
      context: ./server
      dockerfile: Dockerfile
    command: ["node", "dist/worker.js"]
    environment:
      <<: *server-environment
    restart: unless-stopped
    stop_grace_period: 35s

  dispatcher:
    build:
      context: ./server
      dockerfile: Dockerfile
    command: ["node", "dist/dispatcher.js"]
    environment:
      <<: *server-environment
    restart: unless-stopped
    stop_grace_period: 35s
