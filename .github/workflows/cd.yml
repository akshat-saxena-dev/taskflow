name: Publish Images

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: ghcr-main-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish main images to GHCR
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the commit validated by CI
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set image names and immutable commit tag
        id: image
        env:
          TASKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "sha=${TASKFLOW_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.frontend
          push: true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.image.outputs.sha }}
          tags: |
            ${{ steps.image.outputs.prefix }}-frontend:${{ steps.image.outputs.sha }}
            ${{ steps.image.outputs.prefix }}-frontend:latest
          cache-from: type=gha,scope=taskflow-frontend
          cache-to: type=gha,scope=taskflow-frontend,mode=max

      - name: Build and publish backend runtime image names
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.image.outputs.sha }}
          tags: |
            ${{ steps.image.outputs.prefix }}-api:${{ steps.image.outputs.sha }}
            ${{ steps.image.outputs.prefix }}-api:latest
            ${{ steps.image.outputs.prefix }}-worker:${{ steps.image.outputs.sha }}
            ${{ steps.image.outputs.prefix }}-worker:latest
            ${{ steps.image.outputs.prefix }}-dispatcher:${{ steps.image.outputs.sha }}
            ${{ steps.image.outputs.prefix }}-dispatcher:latest
          cache-from: type=gha,scope=taskflow-backend
          cache-to: type=gha,scope=taskflow-backend,mode=max
